name: avvy-dev-infisical

services:
  avvy_infisical_backend:
    container_name: avvy-infisical-backend
    depends_on:
      avvy_infisical_db:
        condition: service_healthy
      avvy_infisical_redis:
        condition: service_started
    image: infisical/infisical:v0.162.18
    pull_policy: always
    env_file: .env
    ports:
      - 7001:8080
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  avvy_infisical_redis:
    image: redis
    container_name: avvy-infisical-dev-redis
    env_file: .env
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - redis_data:/data

  avvy_infisical_db:
    container_name: avvy-infisical-db
    image: postgres:14-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  infisical:
