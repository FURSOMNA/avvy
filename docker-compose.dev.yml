name: avvy-dev-services

services:
  avvy_mongo:
    image: mongo:8.3.8-noble
    container_name: avvy-db
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=local
      - MONGO_INITDB_ROOT_PASSWORD=local
      - MONGO_INITDB_DATABASE=avvy
    volumes:
      - ./.data/db:/data/db

  avvy_rustfs:
    image: rustfs/rustfs:latest
    container_name: avvy-storage
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=local
      - RUSTFS_SECRET_KEY=local
    volumes:
      - ./.data/storage:/data